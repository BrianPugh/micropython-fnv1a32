name: Build MicroPython Native Module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build MicroPython Native Module
        uses: BrianPugh/build-mpy-native-module@main
        with:
          micropython-version: v1.22.2, v1.23.0, v1.24.1, v1.25.0, v1.26.0, v1.27.0
          architecture: all
          static-const-workaround: true

      - name: Install Belay
        run: pipx install belay

      - name: Install MicroPython
        uses: BrianPugh/install-micropython@v2
        with:
          reference: v1.27.0

      - name: Run tests on x64 build
        run: |
          # Use the latest MicroPython version's x64 build for testing
          cp fnv1a32-mpy1.27-x64.mpy fnv1a32.mpy
          belay run micropython -X heapsize=200M -m unittest tests/test_*.py

      - name: Export version for artifact naming
        run: |
          export VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload Native Module MPY Files
        uses: actions/upload-artifact@v5
        with:
          name: mpy-native-module-fnv1a32-${{ env.VERSION }}
          path: "*.mpy"

  release_upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Export version
        run: |
          export VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download All Native Module Artifacts
        uses: actions/download-artifact@v6
        with:
          path: mpy-native-modules
          pattern: mpy-native-module-*
          merge-multiple: true

      - name: Display All Native Module Artifacts
        run: ls -alh mpy-native-modules

      - name: Create tarball of mpy files
        run: |
          tar -czvf mpy-native-modules/fnv1a32-${{ env.VERSION }}.tar.gz -C mpy-native-modules .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mpy-native-modules/*
